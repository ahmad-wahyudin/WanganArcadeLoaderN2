fullscreen = false
# Choose exactly one of the following fullscreen options:
# "exclusive", "monitor-based", or "borderless_windowed"
fullscreen_mode = "exclusive"
preserve_aspect_ratio = false
input_emu = true
jvs_prime_device = "/dev/ttyUSB0" # jvs i/o port
card_emu = true
redir_card = false
card_device = "/dev/ttyM0"
block_sudo = true
ignore_custom_ioctls = true
dongle = "285013501138"
debug_menu = false

# 1% deadzone
deadzone = 0.01
keyboard_steering_sensitivity = 6.0
keyboard_pedal_sensitivity = 2.0
invert_steering = false
invert_gas = false
invert_brake = false

skip_steering_error = true         # only while input_emu is false and steering power is off
skip_calibration_check = false     # works when steering power is on or off in any input_emu mode

# needed for using str board without jvs i/o board using nano
init_kickback = false
pin8_device = "/dev/ttyUSB1"        # nano board for pin8 emulation

width = 640
height = 480

# redirect real jvs i/o board
[[file_redirect]]
from = "/dev/ttyM3"
to = "/dev/ttyUSB0"

# redirect real str board
[[file_redirect]]
from = "/dev/ttyM1"
to = "/dev/ttyS0" 