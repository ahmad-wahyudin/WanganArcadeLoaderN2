fullscreen = false
# Choose exactly one of the following fullscreen options:
# "exclusive", "monitor-based", or "borderless_windowed"
fullscreen_mode = "exclusive"
preserve_aspect_ratio = false
input_emu = true
jvs_prime_device = "/dev/ttyUSB0"
card_emu = true
redir_card = false
card_device = "/dev/ttyM0"
block_sudo = true
ignore_custom_ioctls = true
dongle = "285013501138"
debug_menu = false

# 1% deadzone
deadzone = 0.01
keyboard_steering_sensitivity = 6.0
keyboard_pedal_sensitivity = 2.0
invert_steering = false
invert_gas = false
invert_brake = false

width = 640
height = 480

# redirect real jvs i/o board
[[file_redirect]]
from = "/dev/ttyM3"
to = "/dev/ttyUSB0"